<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Shadow -->
  <ellipse cx="50" cy="85" rx="38" ry="3.5" fill="#E0E0E0"/>
  <!-- Rear wheel -->
  <circle cx="22" cy="74" r="12" fill="#3D4852" stroke="#2D2D2D" stroke-width="2"/>
  <circle cx="22" cy="74" r="6.5" fill="#8A9BA8"/>
  <circle cx="22" cy="74" r="2.5" fill="#C8D4DC"/>
  <line x1="22" y1="67.5" x2="22" y2="80.5" stroke="#8A9BA8" stroke-width="1.2"/>
  <line x1="15.5" y1="74" x2="28.5" y2="74" stroke="#8A9BA8" stroke-width="1.2"/>
  <!-- Front wheel -->
  <circle cx="78" cy="74" r="12" fill="#3D4852" stroke="#2D2D2D" stroke-width="2"/>
  <circle cx="78" cy="74" r="6.5" fill="#8A9BA8"/>
  <circle cx="78" cy="74" r="2.5" fill="#C8D4DC"/>
  <line x1="78" y1="67.5" x2="78" y2="80.5" stroke="#8A9BA8" stroke-width="1.2"/>
  <line x1="71.5" y1="74" x2="84.5" y2="74" stroke="#8A9BA8" stroke-width="1.2"/>
  <!-- Main van body (tall, boxy) -->
  <rect x="8" y="26" width="84" height="47" rx="4" fill="#D0E4F7" stroke="#2D2D2D" stroke-width="2.5"/>
  <!-- Windshield -->
  <rect x="68" y="28" width="21" height="28" rx="3" fill="#6BA8CC" stroke="#2D2D2D" stroke-width="1.5"/>
  <!-- Rear window -->
  <rect x="11" y="28" width="14" height="22" rx="2" fill="#6BA8CC" stroke="#2D2D2D" stroke-width="1.5"/>
  <!-- Side windows row -->
  <rect x="28" y="30" width="16" height="18" rx="2" fill="#6BA8CC" stroke="#2D2D2D" stroke-width="1.5"/>
  <rect x="48" y="30" width="16" height="18" rx="2" fill="#6BA8CC" stroke="#2D2D2D" stroke-width="1.5"/>
  <!-- Sliding door line -->
  <line x1="47" y1="50" x2="47" y2="73" stroke="#2D2D2D" stroke-width="1.8"/>
  <!-- Front door line -->
  <line x1="66" y1="56" x2="66" y2="73" stroke="#2D2D2D" stroke-width="1.5"/>
  <!-- Sliding door handle -->
  <rect x="50" y="62" width="8" height="2.2" rx="1.1" fill="#8ABFDE" stroke="#2D2D2D" stroke-width="0.8"/>
  <!-- Front door handle -->
  <rect x="69" y="62" width="8" height="2.2" rx="1.1" fill="#8ABFDE" stroke="#2D2D2D" stroke-width="0.8"/>
  <!-- Headlight -->
  <rect x="84" y="56" width="8" height="6" rx="3" fill="#FDD87D" stroke="#2D2D2D" stroke-width="1.5"/>
  <!-- Taillight -->
  <rect x="8" y="56" width="6" height="6" rx="2" fill="#F08A85" stroke="#2D2D2D" stroke-width="1.5"/>
</svg>
