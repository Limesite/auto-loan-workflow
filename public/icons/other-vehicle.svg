<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Shadow -->
  <ellipse cx="50" cy="84" rx="34" ry="3.5" fill="#E0E0E0"/>
  <!-- Rear wheel -->
  <circle cx="26" cy="73" r="12" fill="#3D4852" stroke="#2D2D2D" stroke-width="2"/>
  <circle cx="26" cy="73" r="6.5" fill="#8A9BA8"/>
  <circle cx="26" cy="73" r="2.5" fill="#C8D4DC"/>
  <!-- Front wheel -->
  <circle cx="74" cy="73" r="12" fill="#3D4852" stroke="#2D2D2D" stroke-width="2"/>
  <circle cx="74" cy="73" r="6.5" fill="#8A9BA8"/>
  <circle cx="74" cy="73" r="2.5" fill="#C8D4DC"/>
  <!-- Body -->
  <rect x="9" y="55" width="82" height="17" rx="4" fill="#E2E8F0" stroke="#2D2D2D" stroke-width="2.5"/>
  <!-- Cabin -->
  <path d="M30 55 L38 30 Q42 25 50 25 Q58 25 62 30 L70 55 Z" fill="#CBD5E1" stroke="#2D2D2D" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Window -->
  <path d="M55 26 L62 30 L66 54 L55 54 Z" fill="#94A3B8" stroke="#2D2D2D" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M45 26 L38 30 L34 54 L45 54 Z" fill="#94A3B8" stroke="#2D2D2D" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Door divider -->
  <line x1="50" y1="55" x2="50" y2="72" stroke="#2D2D2D" stroke-width="1.5"/>
  <!-- Stars / other indicator -->
  <!-- Star 1 (top left) -->
  <text x="14" y="26" font-size="14" fill="#FBBF24" font-family="sans-serif">✦</text>
  <!-- Star 2 (top right) -->
  <text x="74" y="22" font-size="11" fill="#FBBF24" font-family="sans-serif">✦</text>
  <!-- Star 3 (middle) -->
  <text x="44" y="16" font-size="10" fill="#FBBF24" font-family="sans-serif">✦</text>
  <!-- Question mark -->
  <text x="42" y="48" font-size="18" font-weight="bold" fill="#64748B" font-family="sans-serif" text-anchor="middle">?</text>
  <!-- Headlight -->
  <rect x="85" y="57" width="8" height="6" rx="3" fill="#FDD87D" stroke="#2D2D2D" stroke-width="1.5"/>
  <!-- Taillight -->
  <rect x="7" y="57" width="6" height="6" rx="2" fill="#F08A85" stroke="#2D2D2D" stroke-width="1.5"/>
</svg>
