<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Shadow -->
  <ellipse cx="50" cy="85" rx="36" ry="3.5" fill="#E0E0E0"/>
  <!-- Rear wheel -->
  <circle cx="24" cy="74" r="12" fill="#3D4852" stroke="#2D2D2D" stroke-width="2"/>
  <circle cx="24" cy="74" r="6.5" fill="#8A9BA8"/>
  <circle cx="24" cy="74" r="2.5" fill="#C8D4DC"/>
  <line x1="24" y1="67.5" x2="24" y2="80.5" stroke="#8A9BA8" stroke-width="1.2"/>
  <line x1="17.5" y1="74" x2="30.5" y2="74" stroke="#8A9BA8" stroke-width="1.2"/>
  <!-- Front wheel -->
  <circle cx="76" cy="74" r="12" fill="#3D4852" stroke="#2D2D2D" stroke-width="2"/>
  <circle cx="76" cy="74" r="6.5" fill="#8A9BA8"/>
  <circle cx="76" cy="74" r="2.5" fill="#C8D4DC"/>
  <line x1="76" y1="67.5" x2="76" y2="80.5" stroke="#8A9BA8" stroke-width="1.2"/>
  <line x1="69.5" y1="74" x2="82.5" y2="74" stroke="#8A9BA8" stroke-width="1.2"/>
  <!-- Body -->
  <rect x="8" y="52" width="84" height="21" rx="4" fill="#D0E4F7" stroke="#2D2D2D" stroke-width="2.5"/>
  <!-- Cabin (taller, more upright) -->
  <path d="M16 52 L19 26 Q21 21 50 21 Q79 21 81 26 L84 52 Z" fill="#B8D4ED" stroke="#2D2D2D" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Windshield (upright) -->
  <path d="M62 22 L81 26 L81 51 L62 51 Z" fill="#6BA8CC" stroke="#2D2D2D" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Rear window -->
  <path d="M38 22 L19 26 L19 51 L38 51 Z" fill="#6BA8CC" stroke="#2D2D2D" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Middle window -->
  <rect x="40" y="24" width="20" height="27" rx="2" fill="#6BA8CC" stroke="#2D2D2D" stroke-width="1.5"/>
  <!-- Roof rack -->
  <line x1="25" y1="21" x2="75" y2="21" stroke="#2D2D2D" stroke-width="2"/>
  <line x1="30" y1="18" x2="30" y2="22" stroke="#2D2D2D" stroke-width="1.8"/>
  <line x1="70" y1="18" x2="70" y2="22" stroke="#2D2D2D" stroke-width="1.8"/>
  <!-- Door pillars -->
  <line x1="38" y1="51" x2="38" y2="73" stroke="#2D2D2D" stroke-width="1.5"/>
  <line x1="62" y1="51" x2="62" y2="73" stroke="#2D2D2D" stroke-width="1.5"/>
  <!-- Door handle front -->
  <rect x="65" y="61" width="8" height="2.2" rx="1.1" fill="#8ABFDE" stroke="#2D2D2D" stroke-width="0.8"/>
  <!-- Door handle rear -->
  <rect x="42" y="61" width="8" height="2.2" rx="1.1" fill="#8ABFDE" stroke="#2D2D2D" stroke-width="0.8"/>
  <!-- Headlight -->
  <rect x="84" y="56" width="8" height="6" rx="3" fill="#FDD87D" stroke="#2D2D2D" stroke-width="1.5"/>
  <!-- Taillight -->
  <rect x="8" y="56" width="6" height="6" rx="2" fill="#F08A85" stroke="#2D2D2D" stroke-width="1.5"/>
</svg>
