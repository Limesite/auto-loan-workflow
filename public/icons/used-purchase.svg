<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Shadow -->
  <ellipse cx="50" cy="84" rx="34" ry="3.5" fill="#E0E0E0"/>
  <!-- Rear wheel -->
  <circle cx="26" cy="73" r="12" fill="#3D4852" stroke="#2D2D2D" stroke-width="2"/>
  <circle cx="26" cy="73" r="6.5" fill="#8A9BA8"/>
  <circle cx="26" cy="73" r="2.5" fill="#C8D4DC"/>
  <line x1="26" y1="66.5" x2="26" y2="79.5" stroke="#8A9BA8" stroke-width="1.2"/>
  <line x1="19.5" y1="73" x2="32.5" y2="73" stroke="#8A9BA8" stroke-width="1.2"/>
  <!-- Front wheel -->
  <circle cx="74" cy="73" r="12" fill="#3D4852" stroke="#2D2D2D" stroke-width="2"/>
  <circle cx="74" cy="73" r="6.5" fill="#8A9BA8"/>
  <circle cx="74" cy="73" r="2.5" fill="#C8D4DC"/>
  <line x1="74" y1="66.5" x2="74" y2="79.5" stroke="#8A9BA8" stroke-width="1.2"/>
  <line x1="67.5" y1="73" x2="80.5" y2="73" stroke="#8A9BA8" stroke-width="1.2"/>
  <!-- Body (warm tone for used) -->
  <rect x="9" y="55" width="82" height="17" rx="4" fill="#FEF3C7" stroke="#2D2D2D" stroke-width="2.5"/>
  <!-- Cabin -->
  <path d="M30 55 L37 30 Q42 25 50 25 Q58 25 63 30 L70 55 Z" fill="#FDE68A" stroke="#2D2D2D" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Front window -->
  <path d="M56 26 L63 30 L67 54 L56 54 Z" fill="#D97706" stroke="#2D2D2D" stroke-width="1.5" stroke-linejoin="round" opacity="0.7"/>
  <!-- Rear window -->
  <path d="M44 26 L37 30 L33 54 L44 54 Z" fill="#D97706" stroke="#2D2D2D" stroke-width="1.5" stroke-linejoin="round" opacity="0.7"/>
  <!-- Door divider -->
  <line x1="50" y1="55" x2="50" y2="72" stroke="#2D2D2D" stroke-width="1.5"/>
  <!-- Headlight -->
  <rect x="85" y="57" width="8" height="6" rx="3" fill="#FDD87D" stroke="#2D2D2D" stroke-width="1.5"/>
  <!-- Taillight -->
  <rect x="7" y="57" width="6" height="6" rx="2" fill="#F08A85" stroke="#2D2D2D" stroke-width="1.5"/>
  <!-- Price tag -->
  <rect x="62" y="8" width="28" height="18" rx="3" fill="#FFFFFF" stroke="#2D2D2D" stroke-width="2"/>
  <circle cx="67" cy="13" r="2.5" fill="#2D2D2D"/>
  <line x1="62" y1="8" x2="59" y2="5" stroke="#2D2D2D" stroke-width="1.8"/>
  <text x="76" y="20" font-size="7.5" font-weight="bold" fill="#1F2937" font-family="sans-serif" text-anchor="middle">USED</text>
  <!-- Tag string -->
  <line x1="65" y1="8" x2="70" y2="2" stroke="#2D2D2D" stroke-width="1.5" stroke-linecap="round"/>
